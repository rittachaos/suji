version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: suji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: suji
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: suji-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  server:
    build:
      context: ./server
    container_name: suji-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      - mysql
      - redis
    ports:
      - '3000:3000'

volumes:
  mysql_data:
